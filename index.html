<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0c14">
<title>SHEEP GO BONK</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#0c0c14;overflow:hidden;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  #c{position:fixed;inset:0;display:block;}
</style>

<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* ============================================================
   SHEEP GO BONK - a music-first vertical meme headbutt game
   Single file. Zero dependencies. All audio synthesized live.
   ============================================================ */

// ---------------- utils ----------------
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const rnd   = (a,b)=> a+Math.random()*(b-a);
const rndi  = (a,b)=> Math.floor(rnd(a,b+1));
const pick  = arr => arr[(Math.random()*arr.length)|0];
const TAU = Math.PI*2;
function rrPath(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function fillRR(x,y,w,h,r,color){ ctx.fillStyle=color; rrPath(x,y,w,h,r); ctx.fill(); }
const $ = id => document.getElementById(id);
function storeGet(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
function storeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

// ---------------- canvas / view ----------------
const canvas = $('c'), ctx = canvas.getContext('2d');
const LW=420, LH=900;
let viewScale=1, offX=0, offY=0, cssW=0, cssH=0, DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  cssW = window.innerWidth; cssH = window.innerHeight;
  const colW = Math.min(cssW, cssH*0.56);
  const s = Math.min(colW/LW, cssH/LH);
  viewScale = s;
  const w = LW*s, h = LH*s;
  offX = (cssW-w)/2; offY = (cssH-h)/2;
  canvas.width = Math.round(cssW*DPR);
  canvas.height= Math.round(cssH*DPR);
  canvas.style.width = cssW+'px';
  canvas.style.height= cssH+'px';
}
window.addEventListener('resize', resize);
resize();
function toLocal(cx,cy){
  const r = canvas.getBoundingClientRect();
  return { x:(cx-r.left-offX)/viewScale, y:(cy-r.top-offY)/viewScale };
}
function hit(p, b){ return p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h; }

// ---------------- audio engine ----------------
const BPM = 132;
const BEAT = 60/BPM;            // 0.4545 s
const STEPS = 32;               // 8-beat loop
const A = {
  ctx:null, master:null, musicBus:null, sfxBus:null, comp:null,
  step:0, nextT:0, startT:0, timer:null,
  ready:false, muted: storeGet('sgb_mute','0')==='1',
  intensity:0, bleatsOn:false, alive:true,
  init(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.comp = this.ctx.createDynamicsCompressor();
    this.comp.threshold.value=-18; this.comp.knee.value=24; this.comp.ratio.value=10;
    this.master = this.ctx.createGain(); this.master.gain.value = this.muted?0:0.9;
    this.musicBus = this.ctx.createGain(); this.musicBus.gain.value=0.9;
    this.sfxBus   = this.ctx.createGain(); this.sfxBus.gain.value=0.9;
    this.musicBus.connect(this.master); this.sfxBus.connect(this.master);
    this.master.connect(this.comp); this.comp.connect(this.ctx.destination);
    this.ready = true;
    this.startLoop();
  },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  setMuted(m){ this.muted=m; storeSet('sgb_mute',m?'1':'0'); if(this.master) this.master.gain.value=m?0:0.9; },
  now(){ return this.ctx?this.ctx.currentTime:0; },
  startLoop(){
    this.step=0; this.nextT=this.ctx.currentTime+0.08; this.startT=this.nextT;
    if(this.timer) clearInterval(this.timer);
    this.timer = setInterval(()=>this.schedule(), 25);
  },
  beatCount(){
    if(!this.ctx) return 0;
    return (this.ctx.currentTime - this.startT)/BEAT;
  },
  // ---- voices ----
  env(g,t0,a,peak,dec){
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(peak,t0+a);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+a+dec);
  },
  kick(t,vel){
    const c=this.ctx, o=c.createOscillator(), g=c.createGain();
    o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(44,t+0.11);
    this.env(g,t,0.004,0.55*vel,0.16); o.connect(g); g.connect(this.musicBus);
    o.start(t); o.stop(t+0.2);
  },
  bass(t,f,len,vel){
    const c=this.ctx, o=c.createOscillator(), f2=c.createOscillator(), g=c.createGain(), lp=c.createBiquadFilter();
    o.type='sawtooth'; o.frequency.value=f; f2.type='square'; f2.frequency.value=f*0.5;
    lp.type='lowpass'; lp.frequency.setValueAtTime(620,t); lp.frequency.exponentialRampToValueAtTime(260,t+len);
    const gx=c.createGain(); gx.gain.value=0.35;
    this.env(g,t,0.006,0.22*vel,len);
    o.connect(gx); f2.connect(gx); gx.connect(lp); lp.connect(g); g.connect(this.musicBus);
    o.start(t); f2.start(t); o.stop(t+len+0.05); f2.stop(t+len+0.05);
  },
  hat(t,vel){
    const c=this.ctx;
    const n=this.noise(0.05); const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7200;
    const g=c.createGain(); this.env(g,t,0.002,0.12*vel,0.03);
    n.source.connect(hp); hp.connect(g); g.connect(this.musicBus);
    n.source.start(t); n.source.stop(t+0.07);
  },
  clap(t,vel){
    const c=this.ctx;
    [0,0.018,0.04].forEach((d,i)=>{
      const n=this.noise(0.1); const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1300; bp.Q.value=1.2;
      const g=c.createGain(); this.env(g,t+d,0.003,(i===2?0.28:0.14)*vel,0.06);
      n.source.connect(bp); bp.connect(g); g.connect(this.musicBus);
      n.source.start(t+d); n.source.stop(t+d+0.1);
    });
  },
  stab(t,semi,vel){
    const c=this.ctx, o=c.createOscillator(), o2=c.createOscillator(), g=c.createGain();
    const f=261.6*Math.pow(2,semi/12);
    o.type='square'; o.frequency.setValueAtTime(f*1.01,t); o.frequency.exponentialRampToValueAtTime(f,t+0.05);
    o2.type='sawtooth'; o2.frequency.value=f*2;
    const gx=c.createGain(); gx.gain.value=0.25;
    this.env(g,t,0.005,0.14*vel,0.16);
    o.connect(gx); o2.connect(gx); gx.connect(g); g.connect(this.musicBus);
    o.start(t); o2.start(t); o.stop(t+0.22); o2.stop(t+0.22);
  },
  // signature baa lead / hop bleats
  baa(t,semi,len,vel,bright){
    const c=this.ctx;
    const f=261.6*Math.pow(2,semi/12);
    const o=c.createOscillator(), o2=c.createOscillator(), v=c.createOscillator();
    const bp=c.createBiquadFilter(), g=c.createGain();
    o.type='sawtooth'; o2.type='sawtooth';
    o.frequency.setValueAtTime(f*0.82,t); o.frequency.exponentialRampToValueAtTime(f,t+0.05);
    o2.frequency.setValueAtTime(f*0.82*1.012,t); o2.frequency.exponentialRampToValueAtTime(f*1.012,t+0.05);
    v.type='sine'; v.frequency.value=f*2.4;
    bp.type='bandpass'; bp.frequency.value=900+f*1.2; bp.Q.value=1.6;
    const gv=c.createGain(); gv.gain.value=0.18;
    const gx=c.createGain(); gx.gain.value=bright?0.9:0.6;
    this.env(g,t,0.012,0.2*vel,len);
    o.connect(gx); o2.connect(gx); v.connect(gv); gx.connect(bp); gv.connect(bp); bp.connect(g); g.connect(this.musicBus);
    o.start(t); o2.start(t); v.start(t);
    o.stop(t+len+0.1); o2.stop(t+len+0.1); v.stop(t+len+0.1);
  },
  hopBleat(t,semi,vel){
    // tiny dash bleat - routed to sfx so it sits punchy
    const c=this.ctx;
    const f=330*Math.pow(2,semi/12);
    const o=c.createOscillator(), bp=c.createBiquadFilter(), g=c.createGain();
    o.type='sawtooth';
    o.frequency.setValueAtTime(f*0.75,t); o.frequency.exponentialRampToValueAtTime(f,t+0.03);
    o.frequency.exponentialRampToValueAtTime(f*0.9,t+0.12);
    bp.type='bandpass'; bp.frequency.value=1100; bp.Q.value=2;
    this.env(g,t,0.008,0.12*vel,0.1);
    o.connect(bp); bp.connect(g); g.connect(this.sfxBus);
    o.start(t); o.stop(t+0.16);
  },
  noiseBuf:null,
  noise(len){
    const c=this.ctx;
    if(!this.noiseBuf){
      const len2=1, buf=c.createBuffer(1,c.sampleRate*len2,c.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      this.noiseBuf=buf;
    }
    const s=c.createBufferSource(); s.buffer=this.noiseBuf;
    s.loop=true;
    return {source:s};
  },
  schedule(){
    if(!this.ctx) return;
    const ahead=0.12;
    while(this.nextT < this.ctx.currentTime+ahead){
      this.doStep(this.step, this.nextT);
      const dt = BEAT/4;
      this.nextT += dt;
      this.step=(this.step+1)%STEPS;
    }
  },
  doStep(s,t){
    const I=this.intensity;
    const inMenu = (G.state==='menu'||G.state==='result');
    const mv = inMenu?0.6:1;
    // kick four on the floor
    if(s%4===0) this.kick(t,mv*(I>=4?1.15:1));
    // bass 8ths
    const BASS1=[0,0,7,7,8,8,10,10], BASS2=[5,5,3,3,2,2,0,0];
    if(s%2===0){
      const idx=(s/2)%8; const bar=(s>=16)?1:0;
      const semi = bar? BASS2[idx] : BASS1[idx];
      this.bass(t, 65.4*Math.pow(2,semi/12), BEAT*0.42, mv);
    }
    // hats
    if(I>=1 || inMenu){
      if(s%2===0) this.hat(t, inMenu?0.5:0.8);
      if(I>=3 && s%2===1) this.hat(t,0.55);
    }
    // clap
    if(I>=2 && (s%8===2 || s%8===6)) this.clap(t,0.9);
    // signature baa riff
    const RIFF={0:[7,3],6:[3,2],12:[12,4],16:[8,3],22:[7,2],26:[0,1],28:[3,1],30:[7,2]};
    const r=RIFF[s];
    if(r){
      const leadVel = inMenu?0.55:(I>=2?0.95:0.4);
      this.baa(t,r[0],BEAT*r[1]*0.9,leadVel,I>=3);
    }
    // synth stabs
    if(I>=2 && (s===4||s===20)) this.stab(t, s===4?10:5, 0.7);
    if(I>=3 && (s===10||s===26)) this.stab(t,12,0.5);
    // disco overdrive layer
    if(I>=5 && (s===8||s===24)) this.stab(t,7,0.6);
    if(I>=5 && s%8===0) this.clap(t,0.5);
    // sheep dash bleats on every beat while playing
    if(this.bleatsOn && s%4===0){
      const beat=s/4;
      let semi=-5;
      if(I>=4){ const seq=[0,3,7,10,7,3,5,7]; semi=seq[beat%8]-5; }
      else semi = (beat%2===0)?-5:-3 + rnd(-0.6,0.6);
      this.hopBleat(t,semi, I>=4?0.9:0.7);
    }
    if(I>=5 && s%4===2) this.hopBleat(t, rnd(-1,4), 0.6);
  }
};

// ---- one-shot SFX (guarded) ----
function sfxGuard(){ return !!(A.ready && A.ctx); }
function sfxBox(){
  if(!sfxGuard())return; const c=A.ctx,t=c.currentTime;
  const n=A.noise(0.14), lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=850;
  const g=c.createGain(); A.env(g,t,0.004,0.4,0.12);
  n.source.connect(lp); lp.connect(g); g.connect(A.sfxBus);
  n.source.start(t); n.source.stop(t+0.16);
  const o=c.createOscillator(),g2=c.createGain();
  o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(60,t+0.1);
  A.env(g2,t,0.003,0.3,0.1); o.connect(g2); g2.connect(A.sfxBus);
  o.start(t); o.stop(t+0.13);
}
function sfxBarrel(){
  if(!sfxGuard())return; const c=A.ctx,t=c.currentTime;
  const o=c.createOscillator(),g=c.createGain();
  o.type='square'; o.frequency.setValueAtTime(210,t); o.frequency.exponentialRampToValueAtTime(90,t+0.12);
  A.env(g,t,0.004,0.3,0.12); o.connect(g); g.connect(A.sfxBus);
  o.start(t); o.stop(t+0.15);
  const n=A.noise(0.08),bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2200;
  const g2=c.createGain(); A.env(g2,t,0.003,0.18,0.06);
  n.source.connect(bp); bp.connect(g2); g2.connect(A.sfxBus);
  n.source.start(t); n.source.stop(t+0.1);
}
function sfxSign(){
  if(!sfxGuard())return; const c=A.ctx,t=c.currentTime;
  [880,1325,1765].forEach((f,i)=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type='square'; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*0.7,t+0.3);
    A.env(g,t,0.003,0.13/(i+1),0.32); o.connect(g); g.connect(A.sfxBus);
    o.start(t); o.stop(t+0.36);
  });
}
function sfxDummy(){
  if(!sfxGuard())return; const c=A.ctx,t=c.currentTime;
  const o=c.createOscillator(),g=c.createGain();
  o.type='sine'; o.frequency.setValueAtTime(380,t);
  o.frequency.linearRampToValueAtTime(820,t+0.09); o.frequency.exponentialRampToValueAtTime(240,t+0.25);
  A.env(g,t,0.005,0.3,0.24); o.connect(g); g.connect(A.sfxBus);
  o.start(t); o.stop(t+0.3);
}
function sfxMelon(){
  if(!sfxGuard())return; const c=A.ctx,t=c.currentTime;
  const n=A.noise(0.3),lp=c.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.setValueAtTime(2600,t); lp.frequency.exponentialRampToValueAtTime(500,t+0.22);
  const g=c.createGain(); A.env(g,t,0.004,0.42,0.24);
  n.source.connect(lp); lp.connect(g); g.connect(A.sfxBus);
  n.source.start(t); n.source.stop(t+0.3);
  const o=c.createOscillator(),g2=c.createGain(); o.frequency.value=75;
  A.env(g2,t,0.003,0.3,0.14); o.connect(g2); g2.connect(A.sfxBus);
  o.start(t); o.stop(t+0.18);
}
function sfxSofa(){
  if(!sfxGuard())return; const c=A.ctx,t=c.currentTime;
  const n=A.noise(0.2),bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.setValueAtTime(700,t);
  bp.frequency.exponentialRampToValueAtTime(300,t+0.18);
  const g=c.createGain(); A.env(g,t,0.006,0.34,0.18);
  n.source.connect(bp); bp.connect(g); g.connect(A.sfxBus);
  n.source.start(t); n.source.stop(t+0.22);
}
function sfxBoom(big){
  if(!sfxGuard())return; const c=A.ctx,t=c.currentTime;
  const o=c.createOscillator(),g=c.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(big?70:120,t); o.frequency.exponentialRampToValueAtTime(big?26:40,t+(big?0.9:0.4));
  A.env(g,t,0.005,big?0.6:0.4,big?0.9:0.4); o.connect(g); g.connect(A.sfxBus);
  o.start(t); o.stop(t+(big?1:0.5));
  const n=A.noise(big?0.7:0.3),lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=big?420:900;
  const g2=c.createGain(); A.env(g2,t,0.005,big?0.4:0.2,big?0.6:0.25);
  n.source.connect(lp); lp.connect(g2); g2.connect(A.sfxBus);
  n.source.start(t); n.source.stop(t+(big?0.7:0.3));
}
function sfxWall(){
  if(!sfxGuard())return; const c=A.ctx,t=c.currentTime;
  sfxBoom(true);
  setTimeout(()=>{
    if(!sfxGuard())return;
    const t2=c.currentTime;
    const n=A.noise(0.5),lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=300;
    const g=c.createGain(); A.env(g,t2,0.01,0.25,0.45);
    n.source.connect(lp); lp.connect(g); g.connect(A.sfxBus);
    n.source.start(t2); n.source.stop(t2+0.5);
  },120);
}
function sfxUI(){
  if(!sfxGuard())return; const c=A.ctx,t=c.currentTime;
  const o=c.createOscillator(),g=c.createGain(); o.type='square';
  o.frequency.setValueAtTime(620,t); o.frequency.exponentialRampToValueAtTime(880,t+0.06);
  A.env(g,t,0.004,0.16,0.07); o.connect(g); g.connect(A.sfxBus);
  o.start(t); o.stop(t+0.1);
}
function sfxWhoosh(){
  if(!sfxGuard())return; const c=A.ctx,t=c.currentTime;
  const n=A.noise(0.3),bp=c.createBiquadFilter(); bp.type='bandpass';
  bp.Q.value=1.4; bp.frequency.setValueAtTime(400,t); bp.frequency.exponentialRampToValueAtTime(1800,t+0.2);
  const g=c.createGain(); A.env(g,t,0.02,0.2,0.22);
  n.source.connect(bp); bp.connect(g); g.connect(A.sfxBus);
  n.source.start(t); n.source.stop(t+0.3);
}
function sfxSparkle(){
  if(!sfxGuard())return; const c=A.ctx,t=c.currentTime;
  [0,0.06,0.12].forEach((d,i)=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type='sine'; o.frequency.value=[1040,1320,1560][i];
    A.env(g,t+d,0.004,0.12,0.07); o.connect(g); g.connect(A.sfxBus);
    o.start(t+d); o.stop(t+d+0.1);
  });
}
function sfxRiser(){
  if(!sfxGuard())return; const c=A.ctx,t=c.currentTime;
  const o=c.createOscillator(),g=c.createGain(); o.type='sawtooth';
  o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(1400,t+0.5);
  const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1600;
  A.env(g,t,0.02,0.14,0.5);
  o.connect(lp); lp.connect(g); g.connect(A.sfxBus);
  o.start(t); o.stop(t+0.55);
}

// ---------------- scenes ----------------
/*  Each scene: sky gradient, ground gradient, accent, backdrop draw,
    ambient particle maker. Distinct color language per scene. */
function cloudPuff(x,y,s,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(x,y,18*s,0,TAU); ctx.arc(x+20*s,y+4*s,14*s,0,TAU);
  ctx.arc(x-20*s,y+5*s,13*s,0,TAU); ctx.arc(x+2*s,y-8*s,13*s,0,TAU);
  ctx.fill();
}
const SCENES = [
 { name:'FARM FIELD', tag:'GRASS & GREED',
   sky:['#bfe8ff','#e9f8dd'], ground:['#93dc6e','#57b14c'], line:'rgba(255,255,255,0.26)', accent:'#ffd34d',
   sun:'#fff3b0',
   back(time){
     // sun + hills + clouds
     ctx.fillStyle=this.sun; ctx.beginPath(); ctx.arc(340,92,34,0,TAU); ctx.fill();
     ctx.fillStyle='#9ed08a';
     ctx.beginPath(); ctx.ellipse(60,252,150,44,0,Math.PI,TAU); ctx.fill();
     ctx.beginPath(); ctx.ellipse(380,252,170,52,0,Math.PI,TAU); ctx.fill();
     cloudPuff(70-(time*6)%520,70,0.9,'rgba(255,255,255,0.9)');
     cloudPuff(300-(time*4)%520,120,0.7,'rgba(255,255,255,0.8)');
   },
   ambient:{ rate:0.10, kinds:['seed','pollen'] } },
 { name:'SUNSET STRIP', tag:'CONCRETE CHAOS',
   sky:['#3b2a6b','#ff8a5c'], ground:['#7a4a94','#43275f'], line:'rgba(255,196,120,0.22)', accent:'#ffd166',
   sun:'#ffd59e',
   back(time){
     // striped sun
     ctx.save(); ctx.beginPath(); ctx.arc(210,120,46,0,TAU); ctx.clip();
     ctx.fillStyle=this.sun; ctx.fillRect(160,60,100,120);
     ctx.fillStyle='rgba(59,42,107,0.55)';
     for(let i=0;i<5;i++) ctx.fillRect(160,92+i*14,100,6);
     ctx.restore();

/* pooled, generic; ambient and bursts share arrays */
const PARTS = [];
const AMBIENT = [];
const MAX_P=420, MAX_A=90;
function spawnParticle(o){ if(PARTS.length<MAX_P) PARTS.push(o); }
function spawnAmbient(o){ if(AMBIENT.length<MAX_A) AMBIENT.push(o); }
function burstDebris(x,y,t,scale,colors,kind,n){
  for(let i=0;i<n;i++){
    const a=rnd(0,TAU), sp=rnd(1.5,7)*scale;
    spawnParticle({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-2,
      life:rnd(0.35,0.8), max:0.8, size:rnd(3,8)*scale, color:pick(colors),
      kind, rot:rnd(0,TAU), vr:rnd(-8,8), g:11 });
  }
}
function burstShock(x,y,color){
  spawnParticle({ x,y, vx:0,vy:0, life:0.32,max:0.32, size:10, color, kind:'ring', rot:0,vr:0,g:0 });
  for(let i=0;i<14;i++){
    const a=rnd(0,TAU), sp=rnd(3,10);
    spawnParticle({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:0.4,max:0.4,
      size:rnd(2,5), color, kind:'dot', rot:0,vr:0,g:0 });
  }
}
function burstLines(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=(i/n)*TAU+rnd(-0.2,0.2), sp=rnd(14,26);
    spawnParticle({ x:x+Math.cos(a)*20, y:y+Math.sin(a)*20, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life:0.22, max:0.22, size:rnd(14,26), color, kind:'line', rot:a, vr:0, g:0 });
  }
}
function updateParticles(dt){
  for(let i=PARTS.length-1;i>=0;i--){
    const p=PARTS[i]; p.life-=dt;
    if(p.life<=0){ PARTS.splice(i,1); continue; }
    p.vy += p.g*dt; p.x+=p.vx*60*dt; p.y+=p.vy*60*dt; p.rot+=p.vr*dt;
  }
  for(let i=AMBIENT.length-1;i>=0;i--){
    const p=AMBIENT[i]; p.life-=dt;
    if(p.life<=0){ AMBIENT.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt;
    if(p.x<-20) p.x=440; if(p.x>440) p.x=-20; if(p.y<-20)p.y=920; if(p.y>920)p.y=-20;
  }
}
function drawParticles(list){
  for(const p of list){
    const a=clamp(p.life/p.max,0,1);
    ctx.globalAlpha=a;
    if(p.kind==='ring'){
      const r=(1-a)*90+p.size;
      ctx.strokeStyle=p.color; ctx.lineWidth=4*a+1;
      ctx.beginPath(); ctx.arc(p.x,p.y,r,0,TAU); ctx.stroke();
    } else if(p.kind==='line'){
      // radial speed line, lives on impact bursts
      ctx.strokeStyle=p.color; ctx.lineWidth=3*a+0.5; ctx.lineCap='round';
      const len=p.size*(1-a*0.4);
      ctx.beginPath();
      ctx.moveTo(p.x-Math.cos(p.rot)*len, p.y-Math.sin(p.rot)*len);
      ctx.lineTo(p.x+Math.cos(p.rot)*len, p.y+Math.sin(p.rot)*len);
      ctx.stroke();
    } else if(p.kind==='rod'||p.kind==='shard'){
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);
      ctx.restore();
    } else {
      ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*a,0,TAU); ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}

// ---------------- sheep ----------------
const S = {
  x:0, targetX:0, lean:0, face:'idle', faceT:0,
  blinkT:rnd(1.5,3.5), blinking:0,
  squash:0, stretch:0, tumble:0, tumbleT:0, recoil:0,
  hop:0, deadRot:0, danceT:0, headShakeT:0,
  reset(){
    this.x=0; this.targetX=0; this.lean=0; this.face='focus'; this.faceT=0;
    this.blinkT=rnd(1.5,3.5); this.blinking=0;
    this.squash=0; this.stretch=0; this.tumble=0; this.tumbleT=0; this.recoil=0;
    this.hop=0; this.deadRot=0; this.danceT=0; this.headShakeT=0;
  }
};
function comboStage(){
  if(G.combo>=50) return 5;
  if(G.combo>=30) return 4;
  if(G.combo>=20) return 3;
  if(G.combo>=10) return 2;
  if(G.combo>=5)  return 1;
  return 0;
}
function setFace(f,t){ if(f!==S.face || t>S.faceT){ S.face=f; S.faceT=t; } }
function drawSheep(x,y,sc,opts){
  opts = opts||{};
  const combo = opts.combo||0;
  const stage = opts.stage!==undefined?opts.stage:comboStage();
  const hornGrow = 1 + Math.min(combo,60)/60*0.9;
  // autonomous / combo motion
  let bodyRot=0, headRot=0;
  const t = G.time||0;
  // breathing
  const breathe = 1+Math.sin(t*3.2)*0.015;
  // hop pulse
  const hop = S.hop;
  // dance
  let dance=0;
  if(stage>=5 && G.state==='play'){ dance=Math.sin(S.danceT*10); }
  // head shake (10+) - full headbang at high combo
  if(stage>=2 && G.state==='play'){ headRot += Math.sin(S.headShakeT*16)*0.22; }
  // dead stare rotation
  if(G.state==='dead' || (G.state==='result' && opts.dead)){ headRot += S.deadRot*1.05; bodyRot+=S.deadRot*0.15; }
  if(opts.mascot){ headRot=Math.sin(t*2)*0.06; }

  ctx.save();
  ctx.translate(x, y - hop*26*sc - (stage>=5&&G.state==='play'?Math.abs(dance)*10*sc:0));
  ctx.rotate(bodyRot + (S.tumble>0?S.tumbleT*TAU*1.0:0));
  let sx = lerp(1,1.22,clamp(S.stretch,0,1)) * breathe * (1+dance*0.05);
  let sy = lerp(1,0.82,clamp(S.stretch,0,1)) / breathe;
  const sq = S.squash;
  sx*= 1-sq*0.18; sy*=1+sq*0.22;
  ctx.scale(sc*sx, sc*sy);

  // ---- legs (hop-driven cycle) ----
  const run = G.state==='play'?1:0;
  const cyc = (G.beatPhase!==undefined)?Math.sin(G.beatPhase*Math.PI):0;
  ctx.strokeStyle='#4a4a4a'; ctx.lineWidth=9; ctx.lineCap='round';
  const legY=34;
  let l1=cyc*10*run, l2=-cyc*10*run;
  if(stage>=5 && G.state==='play'){ l1=dance*14; l2=-dance*14; }
  ctx.beginPath();
  ctx.moveTo(-20,legY); ctx.lineTo(-22+l1,legY+26);
  ctx.moveTo(20,legY); ctx.lineTo(22+l2,legY+26);
  if(S.tumble<=0) ctx.stroke();
  // hooves
  ctx.fillStyle='#333';
  if(S.tumble<=0){ ctx.fillRect(-27+l1,legY+22,10,6); ctx.fillRect(17+l2,legY+22,10,6); }

  // ---- tail puff ----
  ctx.fillStyle='#f6efe2';
  ctx.beginPath(); ctx.arc(-34,-6,8+Math.sin(t*8)*1.5,0,TAU); ctx.fill();

  // ---- body: puffy wool ----
  const wool = (cx,cy,r,c1,c2)=>{
    const g=ctx.createRadialGradient(cx-r*0.3,cy-r*0.4,r*0.2,cx,cy,r);
    g.addColorStop(0,c1); g.addColorStop(1,c2);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.fill();
  };
  const woolShade='#e3d9c3';
  // back / scalloped outline first
  ctx.fillStyle=woolShade;
  for(let i=0;i<7;i++){
    const a=Math.PI*(0.15+i*0.115), r=34;
    ctx.beginPath(); ctx.arc(Math.cos(a)*r-6,Math.sin(a)*r-6,15,0,TAU); ctx.fill();
  }
  wool(-4,-2,34,'#fffaf0','#eadfc6');
  wool(-22,8,22,'#fbf4e6','#e6dbc4');
  wool(18,10,20,'#fbf4e6','#e2d7bf');
  wool(-10,-20,20,'#fffaf0','#eee3cd');
  // body shadow under
  ctx.fillStyle='rgba(120,100,70,0.12)';
  ctx.beginPath(); ctx.ellipse(-4,16,26,10,0,0,TAU); ctx.fill();

  // ---- head ----
  ctx.save();
  ctx.translate(20,-16);
  ctx.rotate(headRot + S.lean*0.4);
  // horns behind head (grow with combo)
  const hs = hornGrow;
  const hornColor = stage>=4?'#ffb52e':'#e8b23c';
  ctx.strokeStyle=hornColor; ctx.lineCap='round';
  ctx.lineWidth=7*hs;
  ctx.beginPath();
  ctx.arc(-8,-6,13*hs,Math.PI*0.9,Math.PI*2.1);
  ctx.stroke();
  ctx.lineWidth=6*hs;
  ctx.beginPath();
  ctx.arc(10,-8,10*hs,Math.PI*0.9,Math.PI*2.15);
  ctx.stroke();
  if(stage>=4){
    ctx.strokeStyle='rgba(255,220,120,0.5)'; ctx.lineWidth=11*hs;
    ctx.beginPath(); ctx.arc(-8,-6,13*hs,Math.PI*0.9,Math.PI*2.1); ctx.stroke();
  }
  // ears
  ctx.fillStyle='#8e8e8e';
  ctx.beginPath(); ctx.ellipse(-15,-2,7,5,-0.5,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(16,-3,7,5,0.5,0,TAU); ctx.fill();
  ctx.fillStyle='#b5909a';
  ctx.beginPath(); ctx.ellipse(-15,-2,3.5,2.5,-0.5,0,TAU); ctx.fill();

  // face gray
  const fg=ctx.createLinearGradient(0,-18,0,20);
  fg.addColorStop(0,'#6f6f6f'); fg.addColorStop(1,'#545454');
  ctx.fillStyle=fg;
  rrPath(-15,-18,30,36,14); ctx.fill();
  ctx.strokeStyle='#484848'; ctx.lineWidth=2; rrPath(-15,-18,30,36,14); ctx.stroke();
  // muzzle
  ctx.fillStyle='#c9c2b8';
  rrPath(-10,2,20,13,7); ctx.fill();

  // eyes
  const blink = S.blinking>0;
  const deadLook = opts.dead && G.state==='result';
  const stare = (G.state==='dead');
  // pupil tracking
  let px=0, py=0;
  if(!stare && !deadLook){ px=clamp(G.attX*5,-4,4); py=clamp(G.attY*3,-3,3); }
  if(S.tumble>0){ px=0; py=0; }
  const drawEye=(ex)=>{
    if(blink){ ctx.strokeStyle='#2b2b2b'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(ex-5,-6); ctx.lineTo(ex+5,-6); ctx.stroke(); return; }
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.ellipse(ex,-6,5.5,6.5,0,0,TAU); ctx.fill();
    if(S.tumble>0){
      ctx.strokeStyle='#2b2b2b'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(ex-4,-10); ctx.lineTo(ex+4,-2);
      ctx.moveTo(ex+4,-10); ctx.lineTo(ex-4,-2); ctx.stroke();
    } else {
      ctx.fillStyle='#1c1c1c';
      ctx.beginPath(); ctx.arc(ex+px,-6+py, (stare||deadLook)?3.4:2.6,0,TAU); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.8)';
      ctx.beginPath(); ctx.arc(ex+px-1,-7+py,1,0,TAU); ctx.fill();
    }
  };
  drawEye(-6); drawEye(7);

  // angry brows (except stare: raised)
  ctx.strokeStyle='#3a3a3a'; ctx.lineWidth=2.6; ctx.lineCap='round';
  if(stare||deadLook){
    ctx.beginPath(); ctx.moveTo(-11,-14); ctx.lineTo(-1,-14.5);
    ctx.moveTo(3,-14.5); ctx.moveTo(13,-14); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(-11,-13); ctx.lineTo(-1,-10);
    ctx.moveTo(13,-13); ctx.lineTo(3,-10); ctx.stroke();
  }

  // nose + mouth
  ctx.fillStyle='#3d3d3d';
  ctx.beginPath(); ctx.ellipse(-3,6,2,1.5,0,0,TAU); ctx.ellipse(3,6,2,1.5,0,0,TAU); ctx.fill();
  ctx.strokeStyle='#3d3d3d'; ctx.lineWidth=1.6;
  ctx.beginPath();
  if((S.face==='happy') || (G.state==='play' && G.beatPhase>0.75)){
    ctx.arc(0,9,4,0,Math.PI); // open bleat smile
  } else { ctx.moveTo(-3,11); ctx.lineTo(0,12.5); ctx.lineTo(3,11); }
  ctx.stroke();

  // blush
  if(S.face==='happy'||S.face==='wow'||stage>=3){
    ctx.fillStyle='rgba(255,120,140,0.35)';
    ctx.beginPath(); ctx.arc(-9,2,3.5,0,TAU); ctx.arc(10,2,3.5,0,TAU); ctx.fill();
  }

  // sunglasses (20+)
  if(stage>=3 && !blink && !(stare)){
    ctx.fillStyle='#15151c';
    rrPath(-12,-10,11,8,2); ctx.fill(); rrPath(1,-10,11,8,2); ctx.fill();
    ctx.fillRect(-1,-8,2,3);
    ctx.fillStyle='rgba(255,255,255,0.55)';
    ctx.fillRect(-10,-9,4,2); ctx.fillRect(3,-9,4,2);
  }

  ctx.restore(); // head
  ctx.restore(); // body
}

// ---------------- game state ----------------
const G = {
  state:'menu', scene: clamp(parseInt(storeGet('sgb_scene','0'))||0,0,4),
  time:0, camZ:0, speed:2.1,
  score:0, combo:0, comboT:0, maxCombo:0, bonked:0, buildings:0,
  rows:[], flyers:[], popups:[],
  wallActive:false, nextWallT:9,
  event:null, eventT:0, nextEventT:5, rubberT:0, megaT:0, stormT:0, goldNext:0,
  milestone:'', milestoneC:'#fff', milestoneT:0,
  shake:0, zoom:0, hitstop:0, beatKick:0, flash:0, deathQuip:'',
  beatPhase:0, lastBeat:-1, attX:0, attY:0,
  deadT:0, best: parseInt(storeGet('sgb_best','0'))||0,
  bestCombo: parseInt(storeGet('sgb_bestcombo','0'))||0,
  buttons:[],
  reset(){
    this.time=0; this.camZ=0; this.speed=2.1;
    this.score=0; this.combo=0; this.comboT=0; this.maxCombo=0; this.bonked=0; this.buildings=0;
    this.rows=[]; this.flyers=[]; this.popups=[];
    this.wallActive=false; this.nextWallT=rnd(8.5,11);
    this.event=null; this.eventT=0; this.nextEventT=rnd(5,7);
    this.rubberT=0; this.megaT=0; this.stormT=0; this.goldNext=0;
    this.milestone=''; this.milestoneT=0;
    this.shake=0; this.zoom=0; this.hitstop=0; this.beatKick=0; this.flash=0; this.lastBeat=-1; this.deadT=0;
    S.reset();
    // seed first rows
    let z=2.6;
    while(z<7.6){ this.spawnRow(z); z+=rnd(1.3,1.7); }
  },
  spawnRow(z){
    const diff=clamp(this.time/30,0,1);
    let n = rndi(1,2)+ (Math.random()<diff?1:0);
    const slots=[-1.2,-0.6,0,0.6,1.2];
    // shuffle
    for(let i=slots.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t2=slots[i];slots[i]=slots[j];slots[j]=t2; }
    const objs=[];
    // buildings for huge combos
    if((this.combo>=40 && Math.random()<0.4) || (this.combo>=45 && this.buildings===0)){
      objs.push(this.makeObj(0,'building',false,z));
      this.buildings++;
      this.addPopup('BONK THE BUILDING!', 0, z, '#ffd84d', 22);
    } else {
      const pool=['box','box','barrel','sign','dummy','melon','sofa'];
      for(let i=0;i<Math.min(n,3);i++){
        const gold = this.goldNext>0;
        objs.push(this.makeObj(slots[i], pick(pool), gold, z));
      }
      if(this.goldNext>0) this.goldNext--;
    }
    this.rows.push({z, objs, wall:null});
  },
  makeObj(x,type,gold,z){
    return { x, z, type, r:TYPES[type].r, gold:!!gold,
      spin:0, lift:0, vx:0, vz:0, vlift:0, vr:rnd(-2,2), flying:false, dead:false,
      rest: (type==='sign'||type==='barrel')?0.5:0.32 };
  },
  spawnWall(){
    const z=this.camZ+7.6;
    const gapW=clamp(1.55-this.time*0.022,0.82,1.55);
    const side=Math.random()<0.5?-1:1;
    let g1,g2;
    if(side<0){ g1=-1.5; g2=-1.5+gapW; } else { g1=1.5-gapW; g2=1.5; }
    this.rows.push({z, objs:[], wall:{g1,g2,warnT:0}});
    this.wallActive=true;
    setFace('panic',2);
  },
  addPopup(text,x,z,color,size){
    if(this.popups.length>=8) this.popups.shift();
    this.popups.push({text,x:x+rnd(-0.14,0.14),z,color:color||'#fff',size:size||18,t:0,life:0.85});
  },
  launch(o, vx, vz, power){
    o.flying=true; o.vx=vx; o.vz=vz; o.vlift=rnd(2.2,3.4)*power;
    o.vr=rnd(-9,9);
  }
};

// ---------------- projection ----------------
const HORIZON=250, GROUND_BOT=940, SPREAD=252;
function tOf(z){ return 1/(1+z*0.62); }
function project(x,z,lift){
  const t=tOf(z-G.camZ);
  const sy=HORIZON+(GROUND_BOT-HORIZON)*t - (lift||0)*t*240;
  const sx=LW/2 + x*t*SPREAD;
  return {sx,sy,t};
}
function sheepZ(){ return G.camZ+0.5; }

// ---------------- collisions ----------------
function impact(o, fromSheep, hitter){
  // points
  const tp=TYPES[o.type];
  const onBeat = G.beatPhase<0.2 || G.beatPhase>0.8;
  G.combo++; G.comboT=BEAT*2.8;
  G.maxCombo=Math.max(G.maxCombo,G.combo);
  G.bonked++;
  let pts=tp.pts;
  if(o.gold) pts*=3;
  pts = Math.round(pts*(1+G.combo*0.08)*(onBeat?2:1));
  G.score+=pts;
  // physics launch
  const power = (G.megaT>0?1.8:1) * (fromSheep?1:0.8);
  let dirx, dirz;
  if(fromSheep){
    dirx=clamp(o.x-S.x,-0.8,0.8); dirz=1+G.speed*0.25;
  } else {
    dirx=clamp(hitter.vx*0.4,-2,2); dirz=clamp(hitter.vz*0.7,0.2,3);
  }
  G.launch(o, dirx*power, dirz*power, power);
  // FX at the crossing point
  const ip = project(o.x, sheepZ());
  burstShock(ip.sx, ip.sy, o.gold?'#ffd84d':'#ffffff');
  const mat=tp.debris;
  burstDebris(ip.sx, ip.sy, 1, o.type==='building'?2:1, mat[0], mat[1], o.type==='building'?46:12);
  if(o.type==='building'){
    // huge dust cloud
    for(let i=0;i<26;i++){
      spawnParticle({x:ip.sx+rnd(-80,80),y:ip.sy+rnd(-120,20),vx:rnd(-3,3),vy:rnd(-5,-1),
        life:rnd(0.8,1.6),max:1.6,size:rnd(10,26),color:pick(['rgba(180,170,160,0.7)','rgba(140,130,120,0.6)']),
        kind:'dot',rot:0,vr:0,g:2});
    }
  }
  // camera + juice
  G.shake=Math.min(14, 5+G.combo*0.25+(o.type==='building'?10:0));
  G.zoom=o.type==='building'?0.12:0.06;
  G.hitstop=o.type==='building'?0.12:0.055;
  burstLines(ip.sx, ip.sy, o.gold?'#ffd84d':SCENES[G.scene].accent, o.type==='building'?18:8);
  G.flash=Math.max(G.flash, o.type==='building'?0.5:(o.gold?0.28:0.16));
  S.squash=1;
  // sfx
  tp.sfx();
  if(o.gold) sfxSparkle();
  // face
  setFace(G.combo%5===0?'wow':'happy', 0.5);
  // popups
  G.addPopup((onBeat?'ON BEAT +':'+')+pts, o.x, sheepZ(), onBeat?'#7af5e6':(o.gold?'#ffd84d':'#ffffff'), onBeat?22:18);
  // milestone callouts (screen banner)
  const ms={10:['HEADBANG MODE!','#ffd84d'],20:['SIGMA SHADES!','#ffffff'],
            30:['SPARK HORNS!','#ffb52e'],50:['DISCO DASH!','#ff2e97']}[G.combo];
  if(ms){
    G.milestone=ms[0]; G.milestoneC=ms[1]; G.milestoneT=1.9;
    G.hitstop=Math.max(G.hitstop,0.12); G.flash=0.5;
    burstDebris(ip.sx,ip.sy-40,1,1.2,['#ffd84d','#ff2e97','#22e0ff','#7af5e6','#fff6a8'],'rod',26);
    sfxRiser();
  } else if(G.combo>0 && G.combo%5===0){
    // rotating brainrot callouts every 5 combo
    G.addPopup(pick(['SHEEESH!','NO CAP!','CERTIFIED BONK','BONK GOES BRRR','ABSOLUTELY FERAL','SHEEP DIFF','MAXIMUM FLUFF','HORN DIFF','BAAA-SED','HE STILL GRAZING']),
      S.x+rnd(-0.3,0.3), sheepZ()+0.9, pick(['#ff2e97','#22e0ff','#ffd84d','#7af5e6']), 17);
  }
}

// ---------------- update ----------------
let localBeat=0;
function getBeat(dt){
  if(A.ready && A.ctx && A.ctx.state==='running'){
    return A.beatCount();
  }
  localBeat += dt/BEAT; return localBeat;
}
function updatePlay(dt){
  G.time+=dt;
  const beat=getBeat(dt);
  G.beatPhase=beat%1;
  const fb=Math.floor(beat);
  if(fb!==G.lastBeat){
    G.lastBeat=fb; onBeat();
  }
  // audio intensity follows combo
  A.intensity=comboStage();
  A.bleatsOn=true;

  // input steering
  if(pointer.down){
    S.targetX = clamp((pointer.x/LW-0.5)*3.3, -1.35,1.35);
  }
  if(keys.left) S.targetX-=dt*2.6;
  if(keys.right) S.targetX+=dt*2.6;
  S.targetX=clamp(S.targetX,-1.35,1.35);
  const prevX=S.x;
  S.x=lerp(S.x,S.targetX,1-Math.pow(0.0015,dt));
  S.lean=clamp((S.x-prevX)/dt*0.18,-0.6,0.6);

  // speed ramp
  const target=Math.min(2.1+G.time*0.11+G.combo*0.025, 5.6);
  G.speed=lerp(G.speed,target,dt*1.5);
  G.camZ+=G.speed*dt;

  // hop
  S.hop=Math.abs(Math.sin(G.beatPhase*Math.PI));
  S.headShakeT+=dt; S.danceT+=dt;

  // ---- wall scheduling ----
  if(!G.wallActive && G.time>G.nextWallT){ G.spawnWall(); G.nextWallT=G.time+rnd(5,7.5); }

  // ---- crazy events (phrase synced) ----
  if(fb%8===0 && fb>0 && G.time>G.nextEventT && !G.event){
    triggerEvent(pick(['gold','rubber','storm','mega']));
    G.nextEventT=G.time+rnd(9,14);
  }
  if(G.event){ G.eventT-=dt; if(G.eventT<=0)G.event=null; }
  if(G.rubberT>0)G.rubberT-=dt;
  if(G.megaT>0)G.megaT-=dt;
  if(G.stormT>0)G.stormT-=dt;

  // ---- spawn rows ahead ----
  let furthest=0;
  for(const r of G.rows) furthest=Math.max(furthest,r.z);
  const gap = G.stormT>0?rnd(0.8,1.1):rnd(1.25,1.75);
  while(furthest < G.camZ+7.6){ furthest+=gap; G.spawnRow(furthest); }

  // timers
  if(G.comboT>0){ G.comboT-=dt; if(G.comboT<=0 && G.combo>0){ G.combo=0; } }
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*26);
  if(G.zoom>0)G.zoom=Math.max(0,G.zoom-dt*0.5);
  if(G.flash>0)G.flash=Math.max(0,G.flash-dt*2.4);
  if(G.beatKick>0)G.beatKick=Math.max(0,G.beatKick-dt*3.2);
  if(G.hitstop>0){ G.hitstop-=dt; if(G.hitstop>0){ /* freeze world, keep fx */ updateFxOnly(dt); return; } }

  // face timers
  if(S.faceT>0){ S.faceT-=dt; if(S.faceT<=0) S.face='focus'; }
  // blink
  S.blinkT-=dt;
  if(S.blinkT<=0){ if(S.blinking>0){ S.blinking=0; S.blinkT=rnd(1.6,3.8);} else { S.blinking=0.12; S.blinkT=0.12; } }
  // squash recover
  S.squash=Math.max(0,S.squash-dt*4.5);
  S.stretch=clamp(G.speed/5.6,0,1)*0.8;
  if(S.tumble>0){
    S.tumble-=dt;
    S.x=lerp(S.x,S.tumbleX,dt*3);
    S.recoil=Math.max(0,S.recoil-dt*2);
    if(S.tumble<=0){ S.face='focus'; }
  }

  // attention: nearest static ahead
  let nd=9, nx=0;
  for(const r of G.rows){
    for(const o of r.objs){
      const d=o.z-sheepZ();
      if(d>0&&d<nd){ nd=d; nx=o.x-S.x; }
    }
  }
  G.attX=nx; G.attY=nd/7;

  // ---- sheep vs static objects ----
  const zS=sheepZ();
  for(const r of G.rows){
    for(let i=r.objs.length-1;i>=0;i--){
      const o=r.objs[i];
      if(o.flying||o.dead) continue;
      const dz=o.z-zS;
      if(dz<0.12){
        if(Math.abs(o.x-S.x) < o.r+0.34){
          // HIT - move to flyers
          r.objs.splice(i,1);
          G.flyers.push(o);
          o.z=zS;
          impact(o,true);
        } else if(dz<-0.5){
          o.dead=true; // missed, passed
        }
      }
    }
  }

  // ---- flyers physics ----
  for(let i=G.flyers.length-1;i>=0;i--){
    const o=G.flyers[i];
    o.z+=o.vz*dt; o.x+=o.vx*dt;
    o.vlift-=9*dt; o.lift+=o.vlift*dt;
    o.spin+=o.vr*dt;
    if(o.lift<0){
      o.lift=0;
      const rest = G.rubberT>0?0.92:o.rest;
      o.vlift=-o.vlift*rest;
      o.vx*=0.72; o.vz*=0.78;
      // sign/barrel ricochet back sometimes
      if((o.type==='sign'||o.type==='barrel') && Math.random()<0.3 && G.rubberT<=0){
        o.vz=-Math.abs(o.vz)*0.85;
      }
      if(Math.abs(o.vlift)<0.6)o.vlift=0;
      // landing dust
      if(Math.random()<0.5){
        const lp=project(o.x,o.z);
        spawnParticle({x:lp.sx,y:lp.sy,vx:rnd(-2,2),vy:rnd(-2,-0.5),life:0.4,max:0.4,
          size:rnd(3,6),color:'rgba(220,210,190,0.6)',kind:'dot',rot:0,vr:0,g:3});
      }
    }
    // flyer vs static objects (chain!)
    if(o.lift<1.2){
      for(const r of G.rows){
        if(Math.abs(r.z-o.z)>1.1) continue;
        for(let j=r.objs.length-1;j>=0;j--){
          const q=r.objs[j];
          if(q.flying||q.dead) continue;
          if(Math.abs(q.z-o.z)<0.35 && Math.abs(q.x-o.x)<q.r+o.r){
            r.objs.splice(j,1);
            G.flyers.push(q); q.z=o.z;
            impact(q,false,o);
          }
        }
      }
      // flyer back into sheep -> sheep gets bonked (humor, not death)
      if(S.tumble<=0 && Math.abs(o.z-zS)<0.4 && Math.abs(o.x-S.x)<o.r+0.36 && o.vz<0){
        S.tumble=0.9; S.tumbleT=0; S.tumbleX=clamp(S.x+o.vx*0.3,-1.3,1.3);
        S.squash=1; G.shake=12; G.zoom=0.1;
        G.combo=0;
        sfxDummy(); sfxWhoosh();
        G.addPopup('BONKED YOURSELF!', S.x, zS, '#ff8a5c', 20);
      }
    }
    // cull
    if(o.z<G.camZ-2.2 || o.z>G.camZ+10 || Math.abs(o.x)>4){ G.flyers.splice(i,1); }
  }

  // ---- wall collision ----
  for(const r of G.rows){
    const w=r.wall;
    if(!w || w.fired) continue;
    if(r.z<=zS){
      w.fired=true;
      const open = S.x>w.g1 && S.x<w.g2;
      if(!open){ die(); return; }
      // slipped the gap
      G.addPopup('CLOSE ONE!', S.x, zS+0.4, '#7af5e6', 20);
      setFace('wow',0.8);
    }
  }

  // cull old rows
  for(let i=G.rows.length-1;i>=0;i--){
    if(G.rows[i].z<G.camZ-2.4){
      if(G.rows[i].wall) G.wallActive=false;
      G.rows.splice(i,1);
    }
  }

  // popups
  for(let i=G.popups.length-1;i>=0;i--){
    const p=G.popups[i]; p.t+=dt;
    if(p.t>p.life || p.z<G.camZ-0.6) G.popups.splice(i,1);
  }
  if(G.milestoneT>0) G.milestoneT-=dt;

  // ambient particles
  const sc=SCENES[G.scene];
  if(Math.random()<sc.ambient.rate) makeAmbient(sc);

  updateParticles(dt);
}
function updateFxOnly(dt){
  updateParticles(dt);
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*26);
  if(G.zoom>0)G.zoom=Math.max(0,G.zoom-dt*0.5);
}
function onBeat(){
  G.beatKick=1;

  if(G.state==='play' && Math.random()<0.3){
    const lp=project(S.x,sheepZ());

}
function triggerEvent(kind){
  G.event=kind;

  if(kind==='rubber'){ G.eventT=6; G.rubberT=6; sfxRiser(); }

// ---------------- death ----------------
function die(){
  G.state='dead'; G.deadT=0;
  S.face='shock';
  G.shake=18; G.zoom=0.16; G.hitstop=0.18;
  sfxWall();
  A.bleatsOn=false;

  G.deathQuip=pick(['the wall remains undefeated','wall: 1  sheep: 0','bonk responsibly','that wall was load-bearing','F in the chat','not a skill issue. a wall issue.','bro hit concrete']);
  if(A.musicBus) A.musicBus.gain.cancelScheduledValues(A.now());
  if(A.musicBus) A.musicBus.gain.setTargetAtTime(0.05,A.now(),0.15);
  PARTS.length=0;
  const ip=project(S.x,sheepZ());
  for(let i=0;i<18;i++){

function updateDead(dt){
  G.deadT+=dt;
  updateParticles(dt);
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*20);
  if(G.zoom>0)G.zoom=Math.max(0,G.zoom-dt*0.3);
  if(G.flash>0)G.flash=Math.max(0,G.flash-dt*2.4);
  // after 1s pause, head slowly turns
  if(G.deadT>1.0){
    S.deadRot=clamp((G.deadT-1.0)/1.1,0,1);
    S.face='dead';
  }
  if(G.deadT>3.0){
    // finalize
    G.state='result';
    if(G.score>G.best){ G.best=G.score; storeSet('sgb_best',String(G.best)); }
    if(G.maxCombo>G.bestCombo){ G.bestCombo=G.maxCombo; storeSet('sgb_bestcombo',String(G.bestCombo)); }
    if(A.musicBus) A.musicBus.gain.setTargetAtTime(0.9,A.now(),0.4);
  }
}

// ---------------- drawing ----------------
function drawSceneBase(){
  const sc=SCENES[G.scene];
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,LW,LH); ctx.clip();
  // sky
  const g=ctx.createLinearGradient(0,0,0,HORIZON+30);
  g.addColorStop(0,sc.sky[0]); g.addColorStop(1,sc.sky[1]);
  ctx.fillStyle=g; ctx.fillRect(0,0,LW,HORIZON+30);
  sc.back(G.time);
  // ground
  const gg=ctx.createLinearGradient(0,HORIZON,0,LH);
  gg.addColorStop(0,sc.ground[0]); gg.addColorStop(1,sc.ground[1]);
  ctx.fillStyle=gg; ctx.fillRect(0,HORIZON,LW,LH-HORIZON);

  // beat-synced ground pulse ring rising from the bottom
  if(G.beatKick>0 && G.state==='play'){
    const k=G.beatKick;
    ctx.strokeStyle=`rgba(255,255,255,${0.10*k})`;
    ctx.lineWidth=3;
    const ry=LH-(1-k)*150;
    ctx.beginPath(); ctx.ellipse(LW/2,ry, 90+(1-k)*220, 20+(1-k)*36, 0, 0, TAU); ctx.stroke();
  }

  // perspective band strips + lane lines
  const zS=G.camZ;
  ctx.save();
  ctx.beginPath(); ctx.rect(0,HORIZON,LW,LH-HORIZON); ctx.clip();
  // bands
  for(let i=-2;i<10;i++){
    const z1=Math.ceil(zS)+i;
    if((z1%2)===0){
      const t=tOf(z1-zS), t2=tOf(z1+1-zS);
      const y1=HORIZON+(GROUND_BOT-HORIZON)*t, y2=HORIZON+(GROUND_BOT-HORIZON)*t2;
      ctx.fillStyle='rgba(0,0,0,0.05)';
      ctx.fillRect(0,Math.min(y1,y2),LW,Math.abs(y2-y1));
    }
  }
  // lane edge + center dashes
  ctx.strokeStyle=sc.line; ctx.lineWidth=2;
  if(G.beatKick>0 && G.state==='play'){
    ctx.shadowColor=sc.accent; ctx.shadowBlur=10*G.beatKick;
  }
  [-1.5,1.5].forEach(xx=>{
    ctx.beginPath();
    for(let z=0;z<7.6;z+=0.2){
      const p=project(xx,G.camZ+z);
      if(z===0)ctx.moveTo(p.sx,p.sy); else ctx.lineTo(p.sx,p.sy);
    }
    ctx.stroke();
  });
  ctx.shadowBlur=0;
  ctx.setLineDash([10,14]);
  [ -0.75, 0.75].forEach(xx=>{
    ctx.beginPath();
    for(let z=0;z<7.6;z+=0.2){
      const p=project(xx,G.camZ+z);
      if(z===0)ctx.moveTo(p.sx,p.sy); else ctx.lineTo(p.sx,p.sy);
    }
    ctx.stroke();
  });
  ctx.setLineDash([]);
  ctx.restore();
  ctx.restore(); // release full-scene clip
}
function drawWall(r){
  if(r.z-G.camZ<-0.3) return;
  const w=r.wall;
  const p1=project(w.g1,r.z), p2=project(w.g2,r.z);
  const t=tOf(r.z-G.camZ);
  const baseY=p1.sy;
  const topY=baseY-330*t;
  // left slab (track left edge .. g1)
  const leftX = project(-1.7,r.z).sx;
  const rightX= project(1.7,r.z).sx;
  ctx.save();
  ctx.beginPath(); ctx.rect(0,HORIZON,LW,LH-HORIZON); ctx.clip();
  const slab=(x1,x2)=>{
    const g=ctx.createLinearGradient(0,topY,0,baseY);
    g.addColorStop(0,'#b9bec7'); g.addColorStop(0.12,'#9aa1ab'); g.addColorStop(1,'#6e757f');
    ctx.fillStyle=g; ctx.fillRect(x1,topY,x2-x1,baseY-topY);
    ctx.strokeStyle='#565d66'; ctx.lineWidth=3;
    ctx.strokeRect(x1,topY,x2-x1,baseY-topY);
    // hazard stripes at bottom
    ctx.save(); ctx.beginPath(); ctx.rect(x1,baseY-26*t,x2-x1,26*t); ctx.clip();
    ctx.fillStyle='#ffcc33';
    for(let i=-2;i<26;i++){
      const sx=x1+i*26*t;
      ctx.beginPath(); ctx.moveTo(sx,baseY); ctx.lineTo(sx+13*t,baseY-26*t);
      ctx.lineTo(sx+26*t,baseY-26*t); ctx.lineTo(sx+13*t,baseY); ctx.fill();
    }
    ctx.restore();
    // rivets + cracks
    ctx.fillStyle='rgba(0,0,0,0.18)';
    for(let yy=topY+20*t; yy<baseY-30*t; yy+=46*t){
      ctx.beginPath(); ctx.arc(x1+12*t,yy,3*t,0,TAU); ctx.arc(x2-12*t,yy,3*t,0,TAU); ctx.fill();
    }
    ctx.strokeStyle='rgba(60,60,60,0.4)'; ctx.lineWidth=2*t;
    ctx.beginPath();
    ctx.moveTo(x1+(x2-x1)*0.3,topY+40*t); ctx.lineTo(x1+(x2-x1)*0.42,baseY-60*t);
    ctx.lineTo(x1+(x2-x1)*0.36,baseY-20*t); ctx.stroke();
    // tag
    ctx.fillStyle='rgba(255,255,255,0.75)';
    ctx.font=`900 ${15*t}px system-ui`; ctx.textAlign='center';
    ctx.fillText('BONK PROOF', (x1+x2)/2, topY+60*t);
  };
  slab(leftX,p1.sx);
  slab(p2.sx,rightX);
  // gap arrows warning
  const warn = clamp(1-(r.z-G.camZ-0.5)/7,0,1);
  if(warn>0 && r.z-G.camZ>0.6){
    const gx=(p1.sx+p2.sx)/2, pulse=0.6+0.4*Math.sin(G.time*10);
    ctx.globalAlpha=pulse; ctx.fillStyle='#ff3b3b';
    ctx.font=`900 ${34*t}px system-ui`; ctx.textAlign='center';
    ctx.fillText('!', gx, topY-14*t);
    ctx.globalAlpha=1;
  }
  ctx.restore();
}
function drawWorld(){
  // gather drawables and sort far to near
  const list=[];
  for(const r of G.rows){
    if(r.wall) list.push({z:r.z, wall:r});
    for(const o of r.objs) if(!o.dead) list.push({z:o.z, o});
  }
  for(const o of G.flyers) list.push({z:o.z, o});
  list.sort((a,b)=>b.z-a.z);
  for(const d of list){
    if(d.wall){ if(d.wall.z-G.camZ>-0.3) drawWall(d.wall); continue; }
    const o=d.o;
    const p=project(o.x,o.z,o.lift);
    if(p.t<=0) continue;
    const sc=p.t*1.05;
    // ground shadow
    const sp=project(o.x,o.z,0);
    ctx.fillStyle='rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(sp.sx,sp.sy+4,o.r*SPREAD*p.t*0.9,o.r*SPREAD*p.t*0.32,0,0,TAU); ctx.fill();
    // idle bob for static
    drawTarget(o,p.sx,p.sy,sc*1.05);
    if(o.gold){

      ctx.beginPath(); ctx.arc(p.sx,p.sy,o.r*SPREAD*sc*1.2,0,TAU); ctx.fill();
    }
  }
}

function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

    ctx.save(); rrPath(x,y,cw,ch,12); ctx.clip();
    const gg=ctx.createLinearGradient(0,y,0,y+ch*0.55);
    gg.addColorStop(0,s.sky[0]); gg.addColorStop(1,s.sky[1]);
    ctx.fillStyle=gg; ctx.fillRect(x,y,cw,ch*0.55);
    const gh=ctx.createLinearGradient(0,y+ch*0.55,0,y+ch);
    gh.addColorStop(0,s.ground[0]); gh.addColorStop(1,s.ground[1]);
    ctx.fillStyle=gh; ctx.fillRect(x,y+ch*0.55,cw,ch*0.45);
    ctx.fillStyle=s.sun; ctx.beginPath(); ctx.arc(x+cw/2,y+ch*0.28,8,0,TAU); ctx.fill();
    ctx.restore();
    ctx.strokeStyle= sel?'#ffffff':'rgba(255,255,255,0.35)';
    ctx.lineWidth=sel?4:2;
    rrPath(x,y,cw,ch,12); ctx.stroke();
    ctx.font='800 9px system-ui'; ctx.fillStyle='#fff'; ctx.textAlign='center';
    ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,0.4)';
    ctx.strokeText(codes[i],x+cw/2,y+ch-10);
    ctx.fillText(codes[i],x+cw/2,y+ch-10);
  }
  // selected scene tag
  ctx.font='800 11px system-ui'; ctx.fillStyle=sc.accent;
  ctx.fillText(sc.name+' - '+sc.tag, LW/2, y0+ch+24);

  // best + mute
  ctx.font='800 14px system-ui'; ctx.fillStyle='#fff';
  ctx.fillText('BEST '+G.best+'   MAX COMBO '+G.bestCombo, LW/2, y0+ch+50);
  const mb=button(LW/2-65,y0+ch+64,130,40);
  drawBtn(mb, A.muted?'SOUND OFF':'SOUND ON',null, A.muted?'#6b7484':'#3f7fd6');

  ctx.textAlign='center'; ctx.font='600 10px system-ui'; ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.fillText('v1.1 - original sheep, original beats - drag / A / D to steer',LW/2,868);
}

function rankFor(score){
  if(score>=2000) return 'UN-BONK-LIEVABLE';
  if(score>=1000) return 'LORD OF THE BONK';
  if(score>=500)  return 'HORN ENERGIZER';
  if(score>=250)  return 'CERTIFIED BONKER';
  if(score>=100)  return 'BONK CURIOUS';
  return 'LITTLE LAMB';
}
function drawResult(){
  G.buttons=[];
  // dim
  ctx.fillStyle='rgba(10,8,18,0.72)'; ctx.fillRect(0,0,LW,LH);
  // the staring sheep, small, top
  const bob=Math.sin(G.time*2)*4;
  drawSheep(LW/2,126+bob,1.6,{dead:true,combo:G.maxCombo});
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='900 34px system-ui';
  ctx.lineWidth=7; ctx.strokeStyle='rgba(0,0,0,0.5)';
  ctx.strokeText('BONKED.',LW/2,226);
  ctx.fillStyle='#ff8a5c'; ctx.fillText('BONKED.',LW/2,226);
  // rotating death quip
  ctx.font='700 13px system-ui'; ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.fillText('"'+G.deathQuip+'"',LW/2,250);

  // rank badge
  const rank=rankFor(G.score);
  fillRR(30,270,360,96,18,'rgba(255,255,255,0.10)');
  fillRR(34,274,352,28,10,'rgba(255,255,255,0.06)');
  ctx.font='800 12px system-ui'; ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.fillText('OFFICIAL BONK RANK',LW/2,292);
  ctx.font='900 22px system-ui'; ctx.fillStyle='#ffd84d';
  ctx.fillText(rank,LW/2,326);

  // stats grid (two columns)
  const sc=SCENES[G.scene];
  const stat=(label,val,x,y)=>{
    ctx.font='700 12px system-ui'; ctx.textAlign='left'; ctx.fillStyle='rgba(255,255,255,0.65)';
    ctx.fillText(label,x,y);
    ctx.font='900 17px system-ui'; ctx.textAlign='right'; ctx.fillStyle='#fff';
    ctx.fillText(val,x+156,y);
  };
  stat('SCORE',''+G.score,50,388);
  stat('MAX COMBO',G.maxCombo+' BONK',234,388);
  stat('BONKED',''+G.bonked,50,420);
  stat('BUILDINGS',''+G.buildings,234,420);
  stat('TIME',G.time.toFixed(1)+'s',50,452);
  stat('SCENE',sc.name,234,452);

  // best / new best row
  fillRR(LW/2-130,470,260,28,10,'rgba(0,0,0,0.25)');
  ctx.textAlign='center'; ctx.font='800 13px system-ui';
  ctx.fillStyle= G.score>=G.best && G.score>0 ?'#7af5e6':'rgba(255,255,255,0.65)';
  ctx.fillText(G.score>=G.best && G.score>0 ?'NEW BEST! '+G.best :'BEST '+G.best, LW/2,490);

  const rb=button(LW/2-110,522,220,58);
  drawBtn(rb,'BONK AGAIN','enter / space / tap','#ff6b3d');
  const mb=button(LW/2-80,592,160,46);
  drawBtn(mb,'MENU',null,'#3f7fd6');
}

// ---------------- input ----------------
const pointer={down:false,x:0,y:0,sx:0};
const keys={left:false,right:false};
function pressAction(p){
  if(G.state==='menu'){
    for(const b of G.buttons){
      if(hit(p,b)){
        // figure which: buttons order: play, 5 scenes, mute
        const idx=G.buttons.indexOf(b);
        sfxUI();
        if(idx===0){ startGame(); }
        else if(idx>=1&&idx<=5){ G.scene=idx-1; storeSet('sgb_scene',String(G.scene)); }
        else if(idx===6){ A.setMuted(!A.muted); }
        return;
      }
    }
  } else if(G.state==='result'){
    for(let i=0;i<G.buttons.length;i++){
      if(hit(p,G.buttons[i])){
        sfxUI();
        if(i===0) startGame();
        else if(i===1) G.state='menu';
        return;
      }
    }
  }
}
function startGame(){
  A.init(); A.resume();
  if(A.musicBus){ A.musicBus.gain.cancelScheduledValues(A.now()); A.musicBus.gain.value=0.9; }
  localBeat=0;
  G.reset(); G.state='play';
}
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  A.init(); A.resume();
  const p=toLocal(e.clientX,e.clientY);
  pointer.down=true; pointer.x=p.x; pointer.y=p.y; pointer.sx=p.x;
  if(G.state==='menu'||G.state==='result') pressAction(p);
},{passive:false});
canvas.addEventListener('pointermove',e=>{
  const p=toLocal(e.clientX,e.clientY);
  pointer.x=p.x; pointer.y=p.y;
},{passive:false});
canvas.addEventListener('pointerup',e=>{
  e.preventDefault();
  const p=toLocal(e.clientX,e.clientY);
  pointer.down=false;
},{passive:false});
canvas.addEventListener('pointercancel',()=>{ pointer.down=false; });
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') keys.right=true;
  if(e.key==='Enter'||e.key===' '){
    e.preventDefault();
    if(G.state==='menu') startGame();
    else if(G.state==='result') startGame();
  }
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') keys.right=false;
});
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && A.ctx && A.ctx.state==='suspended') A.resume();
});
window.addEventListener('blur',()=>{ pointer.down=false; keys.left=false; keys.right=false; });

// ---------------- main loop ----------------
let lastT=performance.now();
function frame(now){
  let dt=Math.min((now-lastT)/1000,0.05);
  lastT=now;
  // logical time always advances for idle animation
  if(G.state!=='play') G.time+=dt;
  if(G.state==='play') updatePlay(dt);
  else if(G.state==='dead') updateDead(dt);
  // ambient also drift on menus
  if(G.state!=='play'){
    const sc=SCENES[G.scene];
    if(Math.random()<sc.ambient.rate*0.6) makeAmbient(sc);
    updateParticles(dt);
  }
  if(A.ready){ A.intensity = G.state==='play'?comboStage():0; if(G.state!=='play')A.bleatsOn=false; }

  // ---- render ----
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#0c0c14'; ctx.fillRect(0,0,cssW,cssH);
  ctx.setTransform(DPR*viewScale,0,0,DPR*viewScale,DPR*offX,DPR*offY);

  // camera shake + zoom
  ctx.save();
  if(G.shake>0){ ctx.translate(rnd(-G.shake,G.shake),rnd(-G.shake,G.shake)); }
  if(G.zoom>0){
    const z=1+G.zoom;
    ctx.translate(LW/2,LH/2); ctx.scale(z,z); ctx.translate(-LW/2,-LH/2);
  }
  // dead stare: slow push-in on the sheep's face
  if(G.state==='dead' && G.deadT>1){
    const dz=1+clamp((G.deadT-1)/1.9,0,1)*0.32;
    const sp=project(S.x,sheepZ());
    ctx.translate(sp.sx,sp.sy); ctx.scale(dz,dz); ctx.translate(-sp.sx,-sp.sy);
  }

  if(G.state==='menu'){ drawMenu(); }
  else {
    drawSceneBase();
    drawWorld();
    drawSheepInWorld();
    drawParticles(PARTS);
    drawPopups();
    drawVignette();
    if(G.flash>0){ ctx.fillStyle=`rgba(255,255,255,${G.flash*0.5})`; ctx.fillRect(0,0,LW,LH); }
    if(G.state==='play') drawHUD();
    if(G.state==='dead') drawDeadOverlay();
    if(G.state==='result') drawResult();
  }
  ctx.restore();
  requestAnimationFrame(frame);
}
function drawDeadOverlay(){
  if(G.deadT<0.4){
    ctx.fillStyle=`rgba(255,255,255,${0.5*(1-G.deadT/0.4)})`; ctx.fillRect(0,0,LW,LH);
  }
  // awkward silence beat, then the accusation
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if(G.deadT>1.2 && G.deadT<=2.0){
    const a=clamp((G.deadT-1.2)/0.3,0,1);
    ctx.globalAlpha=a*0.7;
    ctx.font='900 26px system-ui'; ctx.fillStyle='#fff';
    ctx.fillText('. . .', LW/2, 300);
    ctx.globalAlpha=1;
  }
  if(G.deadT>2.0){
    const a=clamp((G.deadT-2.0)/0.4,0,1);
    ctx.globalAlpha=a;
    ctx.font='900 26px system-ui';
    ctx.lineWidth=5; ctx.strokeStyle='rgba(0,0,0,0.45)';
    ctx.strokeText('WHY.', LW/2, 300);
    ctx.fillStyle='#fff'; ctx.fillText('WHY.', LW/2, 300);
    ctx.globalAlpha=1;
  }
}
requestAnimationFrame(frame);

// ---- idempotent startup fallbacks (background tabs / late focus) ----
function bootPoke(){
  if(!document.hidden){ requestAnimationFrame(()=>{ G.time+=0.001; }); }
}
setTimeout(bootPoke,300); setTimeout(bootPoke,1500);
window.addEventListener('focus',bootPoke);
</script>
